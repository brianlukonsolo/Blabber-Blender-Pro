services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: blabber-blender-pro-local
    image: blabber-blender-pro-frontend:latest
    container_name: blabber-blender-pro
    ports:
      # Open http://localhost:8088 in your browser.
      # Change the left number if 8088 is taken on your machine.
      - "8088:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
